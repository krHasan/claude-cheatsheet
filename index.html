<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code — Developer Reference</title>
  <meta name="description"
    content="A searchable reference for Claude Code: slash commands, keyboard shortcuts, CLI flags, and project config paths.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Apply the saved theme before first paint so the page never flashes. -->
  <script>
    try {
      var t = localStorage.getItem('cc-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  </script>
</head>

<body>

  <a class="skip-link" href="#cards">Skip to reference</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">Claude <span>Code</span></div>
      <div class="logo-sub">Developer Reference</div>

      <div class="search-wrap">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search commands, shortcuts, flags…" aria-label="Search the reference">
        <span class="search-hint">/</span>
      </div>

      <div class="filters" role="group" aria-label="Filter by category">
        <button class="chip" data-tag="all" aria-pressed="true">All</button>
        <button class="chip" data-tag="slash" aria-pressed="false">Slash</button>
        <button class="chip" data-tag="keys" aria-pressed="false">Keys</button>
        <button class="chip" data-tag="cli" aria-pressed="false">CLI</button>
        <button class="chip" data-tag="config" aria-pressed="false">Config</button>
      </div>

      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <div class="meta-strip" id="metaStrip"></div>
    <div class="cards" id="cards"></div>
    <p class="empty" id="empty" hidden>No matches. <b>Esc</b> to clear the search.</p>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- ============================================================
     Renderer first, then one file per card.
     The order of these <script> tags is the order of the cards.
     To add a card: create data/<n>-<name>.js and add it here.
     ============================================================ -->
  <script src="assets/js/app.js"></script>

  <script src="data/00-meta.js"></script>
  <script src="data/01-slash-session.js"></script>
  <script src="data/02-slash-code.js"></script>
  <script src="data/03-slash-config.js"></script>
  <script src="data/04-keys-essential.js"></script>
  <script src="data/05-keys-input.js"></script>
  <script src="data/06-prefixes.js"></script>
  <script src="data/07-cli-flags.js"></script>
  <script src="data/08-auth-cli.js"></script>
  <script src="data/09-claude-md.js"></script>

  <script>CHEATSHEET.render();</script>
</body>

</html>
